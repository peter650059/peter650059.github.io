<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav class="site-nav" aria-label="Main navigation">

        <!-- Left: Signature -->
        <a class="masthead__signature"
           href="{{ '/' | relative_url }}"
           aria-label="Homepage" target="_self">
          <img
            src="{{ '/images/signature.png' | relative_url }}"
            alt="Jun-Hsiang Yao signature">
        </a>

        <!-- Right: Navigation -->
        <ul class="visible-links">
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item">
              <a href="{{ domain }}{{ link.url }}" target="_self">{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>

      </nav>
    </div>
  </div>
</div>
