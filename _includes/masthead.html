<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav class="site-nav" aria-label="Main navigation">

        <!-- Left: Signature -->
        <a class="masthead__signature"
           href="{{ '/' | relative_url }}"
           aria-label="Homepage" target="_self">
          <img
            src="{{ '/images/signature.png' | relative_url }}"
            alt="Jun-Hsiang Yao signature">
        </a>

        <!-- Right: Navigation -->
        <div class="masthead__actions">
          <ul class="visible-links">
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item">
              <a href="{{ domain }}{{ link.url }}" target="_self">{{ link.title }}</a>
            </li>
          {% endfor %}
          </ul>
          <button class="theme-toggle" type="button" aria-label="Dark mode"
                  aria-pressed="false" title="Switch to dark mode" hidden>
            <svg class="theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
            </svg>
            <svg class="theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M20.9 13.1A8.7 8.7 0 0 1 10.9 3.1 8.7 8.7 0 1 0 20.9 13.1Z"></path>
              <path d="M18 2v4m-2-2h4"></path>
            </svg>
          </button>
        </div>

      </nav>
    </div>
  </div>
</div>
